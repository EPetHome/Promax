schema_version: 2

contexts:
  - context_type: general-workspace
    description: Promax 通用工作区，不属于任何 Agent 团队实例。
    preset_resolution:
      mode: fixed
      preset_id: general
    team_revision_required: false
    ordinary_user_visible: true

  - context_type: team-instance
    description: GUI 管理的 Agent 团队实例；新架构必须显式引用一个已发布且不可变的 TeamRevision。
    preset_resolution:
      mode: team-revision-field
      reference_field: team_revision_id
      field: preset_id
      accepted_revision_statuses:
        - published
    team_revision_required: true
    ordinary_user_visible: true

  - context_type: preset-authoring
    description: 为高级 AgentModule/preset 作者预留的创作上下文，不承载普通业务会话。
    preset_resolution:
      mode: fixed
      preset_id: cordis
    team_revision_required: false
    ordinary_user_visible: false
    availability: administrator-only

session_binding:
  resolve_preset: once-at-session-create
  resume_preset: use-session-record
  allow_preset_rebind: false
  silent_migration: forbidden
  team_definition_change_effect: publish-new-revision
  team_revision_change_effect: new-sessions-only

failure_policy:
  missing_context_mapping: reject-session-create
  missing_team_revision: reject-session-create
  unpublished_team_revision: reject-session-create
  missing_preset: reject-session-create
  fallback_preset: none

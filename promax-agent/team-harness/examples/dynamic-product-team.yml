api_version: promax.ai/v1alpha2
kind: TeamDefinition
metadata:
  team_id: product-studio
  display_name: 动态产品方案团队
  description: 使用统一产品方案 AgentModule 交付 PRD、流程图和原型。
  source_recipe_ref: product-studio@1
spec:
  workspace:
    mode: team-folder
    default_output_root: deliverables
    resource_root: team-resources
    resource_manifest_path: .promax/team-resource-manifest.yml
  coordinator:
    member_id: product_studio_lead
    display_name: 产品负责人
    module_ref: team-coordinator@1
    persona_fragment: 以产品负责人视角组织需求澄清、产物一致性和交付说明。
    role_instructions: |-
      启动成员前先写 deliverables/<task-key>/source-ledger.md，列出真实读取的来源、可定位证据、输入矛盾和缺口，并冻结为 worker 只读的共享证据。给成员的任务必须写明目标、唯一允许写入的文件、证据路径和 G0-G6 验收要求。
  members:
    - member_id: solution_design
      display_name: 产品需求方案智能体
      module_ref: product-solution@1
      enabled: true
  coordination:
    topology: orchestrator-workers
    parallelize_independent_tasks: true
    wait_for_settlement: true
    retry_owner: original-worker
  receipt_fields:
    - 状态
    - preset
    - team_revision_id
    - task-key
    - 团队成员
    - 产物
    - G0-G6
    - 被阻断项
    - 未验证项

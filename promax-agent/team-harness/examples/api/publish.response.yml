    capabilities:
      - capability_id: product-prd-agent
        member_id: product_prd_agent
        skill_refs: [prd-document-generator@1]
        artifact_kinds: [prd]
      - capability_id: product-diagram-agent
        member_id: product_diagram_agent
        skill_refs: [business-diagram-generator@1]
        artifact_kinds: [diagram]
      - capability_id: product-prototype-agent
        member_id: product_prototype_agent
        skill_refs: [interactive-prototype-generator@1]
        artifact_kinds: [prototype]
    artifacts:
      - kind: other
        validation_kind: general-report
        relative_path: deliverables/{task_key}/source-ledger.md
        required: true
        produced_by: product_studio_lead
      - kind: prd
        validation_kind: prd
        relative_path: deliverables/{task_key}/prd.md
        required: true
        produced_by: product_prd_agent
      - kind: diagram
        validation_kind: diagram
        relative_path: deliverables/{task_key}/business-diagram.md
        required: true
        produced_by: product_diagram_agent
      - kind: prototype
        validation_kind: prototype
        relative_path: deliverables/{task_key}/prototype.html
        required: true
        produced_by: product_prototype_agent
    domain_rubrics:
      prd:
        display_name: PRD 领域规则
        rules:
          - rule_id: PRD-DEMO-001
            defect_type: completeness
            check: 关键需求必须包含可验证的验收标准。
            fail_evidence:
              - 任一关键需求缺少验收标准。
    coordination:
      topology: orchestrator-workers
      parallelize_independent_tasks: true
      wait_for_settlement: true
      retry_owner: original-worker
      orchestrator_member_id: product_studio_lead
      max_depth: 1
    routing:
      default_target_member_id: product_studio_lead
      mention_syntax: '@<member_id|display_name>'
      mention_match: leading-longest-exact
      unknown_mention: reject-before-send
      multiple_mentions: coordinator-mediated
      members:
        - member_id: product_studio_lead
          display_name: 产品负责人
          role: orchestrator
          mention_aliases: [product_studio_lead, 产品负责人]
          target_kind: root-session
          runtime_tool_id: null
        - member_id: product_prd_agent
          display_name: PRD 专员
          role: worker
          mention_aliases: [product_prd_agent, PRD 专员]
          target_kind: subagent-session
          runtime_tool_id: product_prd_agent
        - member_id: product_diagram_agent
          display_name: 业务流程专员
          role: worker
          mention_aliases: [product_diagram_agent, 业务流程专员]
          target_kind: subagent-session
          runtime_tool_id: product_diagram_agent
        - member_id: product_prototype_agent
          display_name: 交互原型专员
          role: worker
          mention_aliases: [product_prototype_agent, 交互原型专员]
          target_kind: subagent-session
          runtime_tool_id: product_prototype_agent
    runtime_mapping:
      driver: dsh-tool-subagent
      scope: session
      worker_instance_cardinality: zero-or-many-per-member
      instance_key_fields: [team_revision_id, parent_session_id, child_session_id]
      root:
        member_id: product_studio_lead
        instance_kind: root-session
        session_id_source: sessions.create.sessionId
      worker_observation:
        runtime_tool_id_source: parent.tool_call.name
        child_session_id_source: parent.tool_result.subagentId
        parent_session_id_source: root.sessionId
        lineage_parent_source: child.header.parentSession
      workers:
        - member_id: product_prd_agent
          runtime_tool_id: product_prd_agent
          provider: spawn
          background_mode: continuable
          max_depth: 1
        - member_id: product_diagram_agent
          runtime_tool_id: product_diagram_agent
          provider: spawn
          background_mode: continuable
          max_depth: 1
        - member_id: product_prototype_agent
          runtime_tool_id: product_prototype_agent
          provider: spawn
          background_mode: continuable
          max_depth: 1
    receipt_fields: [状态, preset, team_revision_id, task-key, 团队成员, 产物, G0-G6, 被阻断项, 未验证项]
    session_policy:
      preset_binding: create-time
      allow_preset_rebind: false
      silent_migration: forbidden
      configuration_change_effect: publish-new-team-revision
      resource_change_effect: update-workspace-manifest-without-team-revision

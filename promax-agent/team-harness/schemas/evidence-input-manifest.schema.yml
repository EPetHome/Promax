$schema: https://json-schema.org/draft/2020-12/schema
$id: https://promax.local/schemas/evidence-input-manifest.schema.yml
title: Promax EvidenceInputManifest
type: object
additionalProperties: false
required: [api_version, kind, metadata, spec]
properties:
  api_version:
    const: promax.ai/v1alpha2
  kind:
    const: EvidenceInputManifest
  metadata:
    type: object
    additionalProperties: false
    required: [task_key, frozen, frozen_at]
    properties:
      task_key:
        type: string
        pattern: '^(?!\.{1,2}$)[^<>:"/\\|?*\x00-\x1F\x7F]{1,40}$'
      frozen:
        const: true
      frozen_at:
        type: string
        pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
  inputs:
    type: object
    additionalProperties: false
    required: [src_files]
    properties:
      src_files:
        type: array
        maxItems: 256
        items:
          type: object
          additionalProperties: false
          required: [source_id, original_filename, relative_path, bytes, sha256, agent_readable]
          properties:
            source_id:
              type: string
              pattern: ^SRC-[0-9]{3,6}$
            original_filename:
              type: string
              minLength: 1
              maxLength: 255
            relative_path:
              type: string
              pattern: '^\.promax/input/(?!\.{1,2}/)[^<>:"/\\|?*\x00-\x1F\x7F]{1,40}/sources/SRC-[0-9]{3,6}/[A-Za-z0-9._-]+$'
            bytes:
              type: integer
              minimum: 0
            sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            agent_readable:
              type: boolean
            conversion:
              type: object
              additionalProperties: false
              required: [tool, version, from_source_id]
              properties:
                tool:
                  type: string
                  minLength: 1
                version:
                  type: string
                  minLength: 1
                from_source_id:
                  type: string
                  pattern: ^SRC-[0-9]{3,6}$
  spec:
    type: object
    additionalProperties: false
    required: [source_root, sources]
    properties:
      source_root:
        type: string
        pattern: '^\.promax/input/(?!\.{1,2}/)[^<>:"/\\|?*\x00-\x1F\x7F]{1,40}/sources$'
      sources:
        type: array
        minItems: 1
        maxItems: 256
        items:
          type: object
          additionalProperties: false
          required: [source_id, relative_path, sha256, media_type, origin_kind]
          properties:
            source_id:
              type: string
              pattern: ^SRC-[0-9]{3,6}$
            relative_path:
              type: string
              pattern: '^\.promax/input/(?!\.{1,2}/)[^<>:"/\\|?*\x00-\x1F\x7F]{1,40}/sources/SRC-[0-9]{3,6}/[A-Za-z0-9._-]+$'
            sha256:
              type: string
              pattern: ^[a-f0-9]{64}$
            media_type:
              type: string
              pattern: ^[a-z0-9!#$&^_.+-]+/[a-z0-9!#$&^_.+-]+$
            origin_kind:
              enum: [user-provided, web-snapshot]
            original_url:
              type: string
              pattern: ^https?://
            captured_at:
              type: string
              pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
            fetch_status:
              enum: [success, failed]
            http_status:
              type: integer
              minimum: 0
              maximum: 599
          allOf:
            - if:
                properties:
                  origin_kind:
                    const: web-snapshot
              then:
                required: [original_url, captured_at, fetch_status, http_status]

$schema: https://json-schema.org/draft/2020-12/schema
$id: https://promax.local/schemas/api/instantiate.schema.yml
title: Promax GUI Team Instantiation API
oneOf:
  - $ref: '#/$defs/request'
  - $ref: '#/$defs/response'
  - $ref: error.schema.yml
$defs:
  issue:
    type: object
    additionalProperties: false
    required: [code, severity, field_path, message]
    properties:
      code: { type: string }
      severity: { enum: [error, warning] }
      field_path: { type: string }
      message: { type: string }
      hint: { type: string }
  document:
    type: object
    additionalProperties: false
    required: [document_id, filename, media_type, content, sha256]
    properties:
      document_id: { type: string, pattern: '^doc_[a-z0-9]{8,32}$' }
      filename: { enum: [AGENTS.md, SOUL.md, SKILL.md] }
      media_type: { const: text/markdown }
      content: { type: string, maxLength: 1048576 }
      sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
  recipeSource:
    type: object
    additionalProperties: false
    required: [type, recipe_ref]
    properties:
      type: { const: recipe }
      recipe_ref:
        description: 可提交 catalog 的精确 recipe_ref，或 Agent 线声明的稳定别名；响应总是解析为精确版本。
        type: string
        pattern: '^[a-z][a-z0-9-]{2,47}(?:@[1-9][0-9]*)?$'
  promptSource:
    type: object
    additionalProperties: false
    required: [type, prompt]
    properties:
      type: { const: prompt }
      prompt: { type: string, minLength: 1, maxLength: 1800 }
      recipe_ref: { type: string, pattern: '^[a-z][a-z0-9-]{2,47}(?:@[1-9][0-9]*)?$' }
      documents:
        type: array
        minItems: 1
        maxItems: 32
        items: { $ref: '#/$defs/document' }
  documentsSource:
    type: object
    additionalProperties: false
    required: [type, documents]
    properties:
      type: { const: documents }
      recipe_ref: { type: string, pattern: '^[a-z][a-z0-9-]{2,47}(?:@[1-9][0-9]*)?$' }
      prompt: { type: string, minLength: 1, maxLength: 1800 }
      documents:
        type: array
        minItems: 1
        maxItems: 32
        items: { $ref: '#/$defs/document' }
  request:
    type: object
    additionalProperties: false
    required: [api_version, kind, team_id, display_name, workspace_ref, source]
    properties:
      api_version: { const: promax.ai/v1alpha2 }
      kind: { const: InstantiateRequest }
      request_id: { type: string, pattern: '^ins_[a-z0-9]{8,32}$' }
      team_id: { type: string, pattern: '^[a-z][a-z0-9-]{2,47}$' }
      display_name: { type: string, minLength: 1, maxLength: 80 }
      description: { type: string, minLength: 1, maxLength: 500 }
      workspace_ref:
        description: GUI 拥有的稳定 workspace 标识；不是本地路径。
        type: string
        pattern: '^[a-z][a-z0-9-]{2,95}$'
      revision: { type: integer, minimum: 1, default: 1 }
      source:
        oneOf:
          - $ref: '#/$defs/recipeSource'
          - $ref: '#/$defs/promptSource'
          - $ref: '#/$defs/documentsSource'
  sourceSummary:
    type: object
    additionalProperties: false
    required: [input_type, recipe_ref, prompt_applied, document_count]
    properties:
      input_type: { enum: [recipe, prompt, documents] }
      recipe_ref: { type: string, pattern: '^[a-z][a-z0-9-]{2,47}@[1-9][0-9]*$' }
      prompt_applied: { type: boolean }
      document_count: { type: integer, minimum: 0, maximum: 32 }
  routeMember:
    type: object
    additionalProperties: false
    required: [member_id, display_name, role, mention_aliases, target_kind, runtime_tool_id]
    properties:
      member_id: { type: string }
      display_name: { type: string }
      role: { enum: [orchestrator, worker] }
      mention_aliases:
        type: array
        minItems: 1
        uniqueItems: true
        items: { type: string, minLength: 1 }
      target_kind: { enum: [root-session, subagent-session] }
      runtime_tool_id: { type: [string, 'null'] }
  routing:
    type: object
    additionalProperties: false
    required: [default_target_member_id, mention_syntax, mention_match, unknown_mention, multiple_mentions, members]
    properties:
      default_target_member_id: { type: string }
      mention_syntax: { const: '@<member_id|display_name>' }
      mention_match: { const: leading-longest-exact }
      unknown_mention: { const: reject-before-send }
      multiple_mentions: { const: coordinator-mediated }
      members:
        type: array
        minItems: 2
        items: { $ref: '#/$defs/routeMember' }
  reviewItem:
    type: object
    additionalProperties: false
    required: [review_id, kind, document_id, claimed_name, content_sha256, reason_code, action]
    properties:
      review_id: { type: string }
      kind: { const: unknown-skill }
      document_id: { type: string }
      claimed_name: { type: [string, 'null'] }
      content_sha256: { type: string, pattern: '^[a-f0-9]{64}$' }
      reason_code: { enum: [SKILL_HASH_MISMATCH, SKILL_NOT_IN_ALLOWED_CATALOG] }
      action: { const: manual-review-required }
  response:
    type: object
    additionalProperties: false
    required: [api_version, kind, status, team_id, workspace_ref, resolved_source, publication_performed, skill_install_performed, execution_performed, team_definition, team_revision, preset_id, routing, validation, warnings, matched_skill_refs, review_items, next_action]
    properties:
      api_version: { const: promax.ai/v1alpha2 }
      kind: { const: InstantiateResponse }
      request_id: { type: string }
      status: { enum: [published, review-required, draft-invalid] }
      team_id: { type: string }
      workspace_ref: { type: string }
      resolved_source: { $ref: '#/$defs/sourceSummary' }
      publication_performed: { type: boolean }
      skill_install_performed: { const: false }
      execution_performed: { const: false }
      team_definition: { $ref: ../team-definition.schema.yml }
      team_revision:
        oneOf:
          - $ref: ../team-revision.schema.yml
          - type: 'null'
      preset_id: { type: [string, 'null'] }
      routing: { $ref: '#/$defs/routing' }
      validation:
        type: object
        additionalProperties: false
        required: [valid, errors]
        properties:
          valid: { type: boolean }
          errors: { type: array, items: { $ref: '#/$defs/issue' } }
      warnings: { type: array, items: { $ref: '#/$defs/issue' } }
      matched_skill_refs: { type: array, uniqueItems: true, items: { type: string } }
      review_items: { type: array, items: { $ref: '#/$defs/reviewItem' } }
      next_action: { enum: [create-session-with-preset, review-and-publish] }

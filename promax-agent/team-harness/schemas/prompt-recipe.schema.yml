$schema: https://json-schema.org/draft/2020-12/schema
$id: https://promax.local/schemas/prompt-recipe.schema.yml
title: Promax PromptRecipe
type: object
additionalProperties: false
required: [api_version, kind, metadata, spec]
properties:
  api_version:
    const: promax.ai/v1alpha2
  kind:
    const: PromptRecipe
  metadata:
    type: object
    additionalProperties: false
    required: [recipe_id, revision, status, display_name, description]
    properties:
      recipe_id:
        type: string
        pattern: ^[a-z][a-z0-9-]{2,47}$
      revision:
        type: integer
        minimum: 1
      status:
        const: published
      display_name:
        type: string
        minLength: 1
        maxLength: 80
      description:
        type: string
        minLength: 1
        maxLength: 500
  spec:
    type: object
    additionalProperties: false
    required: [team_defaults, workspace, coordinator, members, coordination, receipt_fields]
    properties:
      team_defaults:
        type: object
        additionalProperties: false
        required: [display_name, description]
        properties:
          display_name:
            type: string
            minLength: 1
            maxLength: 80
          description:
            type: string
            minLength: 1
            maxLength: 500
      workspace:
        type: object
        additionalProperties: false
        required: [mode, default_output_root, resource_root, resource_manifest_path]
        properties:
          mode:
            const: team-folder
          default_output_root:
            const: deliverables
          resource_root:
            const: team-resources
          resource_manifest_path:
            const: .promax/team-resource-manifest.yml
      coordinator:
        allOf:
          - $ref: '#/$defs/recipeMember'
          - not:
              type: object
              required: [enabled]
      members:
        type: array
        minItems: 1
        maxItems: 12
        items:
          allOf:
            - $ref: '#/$defs/recipeMember'
            - type: object
              required: [enabled]
              properties:
                enabled:
                  type: boolean
      coordination:
        type: object
        additionalProperties: false
        required: [topology, parallelize_independent_tasks, wait_for_settlement, retry_owner]
        properties:
          topology:
            const: orchestrator-workers
          parallelize_independent_tasks:
            type: boolean
          wait_for_settlement:
            const: true
          retry_owner:
            const: original-worker
      receipt_fields:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
          maxLength: 64
$defs:
  recipeMember:
    type: object
    additionalProperties: false
    required: [member_id, display_name, module_ref]
    properties:
      member_id:
        type: string
        pattern: ^[a-z][a-z0-9_]{2,47}$
      display_name:
        type: string
        minLength: 1
        maxLength: 80
      module_ref:
        type: string
        pattern: ^[a-z][a-z0-9-]{2,47}@[1-9][0-9]*$
      enabled:
        type: boolean
      persona_fragment:
        type: string
        maxLength: 2000
      role_instructions:
        type: string
        maxLength: 4000
      skill_refs:
        type: array
        maxItems: 32
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,63}@[1-9][0-9]*$

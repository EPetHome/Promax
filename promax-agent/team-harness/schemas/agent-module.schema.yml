$schema: https://json-schema.org/draft/2020-12/schema
$id: https://promax.local/schemas/agent-module.schema.yml
title: Promax AgentModule
type: object
additionalProperties: false
required: [api_version, kind, metadata, spec]
properties:
  api_version:
    const: promax.ai/v1alpha2
  kind:
    const: AgentModule
  metadata:
    type: object
    additionalProperties: false
    required: [module_id, revision, display_name, description]
    properties:
      module_id:
        type: string
        pattern: ^[a-z][a-z0-9-]{2,47}$
      revision:
        type: integer
        minimum: 1
      display_name:
        type: string
        minLength: 1
        maxLength: 80
      description:
        type: string
        minLength: 1
        maxLength: 500
  spec:
    type: object
    additionalProperties: false
    required: [role, objective, base_persona, skill_refs, provides, requires, artifacts, validation_profile_id]
    properties:
      role:
        enum: [coordinator, worker]
      objective:
        type: string
        minLength: 1
        maxLength: 500
      base_persona:
        description: Agent 线维护的不可覆盖基础 persona；GUI 不能提交或替换本字段。
        type: string
        minLength: 1
      skill_refs:
        type: array
        maxItems: 32
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z][a-z0-9-]{2,63}@[1-9][0-9]*$
      provides:
        description: 本 module 产物可提供的信息项；所有 module 的 provides 去重后形成团队词表。
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/informationKey'
      requires:
        description: 开工所需信息项；必须属于当前团队 provides 去重得到的词表。
        type: array
        uniqueItems: true
        items:
          $ref: '#/$defs/informationKey'
      tool_profile_id:
        type: string
        pattern: ^[a-z][a-z0-9-]{2,47}$
      delegation:
        type: object
        additionalProperties: false
        required: [provider, background_mode, max_depth]
        properties:
          provider:
            const: spawn
          background_mode:
            const: continuable
          max_depth:
            const: 1
      artifacts:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [kind, validation_kind, relative_path, required]
          properties:
            kind:
              type: string
              pattern: ^[a-z][a-z0-9-]{1,31}$
            validation_kind:
              description: Promax 内部验证分类；与外部上报 kind 分离，RubricCatalog 只按本字段精确匹配。
              type: string
              pattern: ^[a-z][a-z0-9-]{1,63}$
            relative_path:
              type: string
              minLength: 1
            required:
              type: boolean
      validation_profile_id:
        description: 预留标识；当前编译器不消费。本字段不代表 G0–G6 已机械生效，机械判定只来自 RubricCatalog 与静态 CLI 校验。
        type: string
        pattern: ^[a-z][a-z0-9-]{2,47}$
    allOf:
      - if:
          properties:
            role:
              const: worker
        then:
          required: [tool_profile_id, delegation]
          properties:
            artifacts:
              type: array
              minItems: 1
        else:
          not:
            anyOf:
              - required: [tool_profile_id]
              - required: [delegation]
$defs:
  informationKey:
    enum:
      - goal
      - target_user
      - scenario
      - pain_point
      - scope
      - constraint
      - success_criteria
      - competitive_difference
      - requirements_priority

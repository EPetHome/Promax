              rules:
                - rule_id: CUSTOMER_RESEARCH_REQUIRED_SECTIONS
                  defect_type: CUSTOMER_RESEARCH_STRUCTURE_MISSING
                  check: 逐字检查最终 Markdown 是否按顺序包含 customer-research Skill 规定的 0–10 节标题；输入无依据的内容写“未提供”或“不适用”，不能删节。

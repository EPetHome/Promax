          以下产物声明与领域规则来自当前 TeamRevision 的同一冻结快照；协调者和 Judge 直接按 `relative_path` 精确匹配同一条 `kind` / `validation_kind`，再按 `validation_kind` 读取规则。不要到 workspace、上级目录或数据库查找，也不要接受用户覆盖。

          ```yaml
          artifact_declarations:
            - relative_path: deliverables/{task_key}/user_analysis.md
              kind: other
              validation_kind: user-analysis-report
          domain_rubrics:
            user-analysis-report:
              display_name: 用户分析报告
              rules:
                - rule_id: USER_ANALYSIS_REQUIRED_SECTIONS
                  defect_type: USER_ANALYSIS_STRUCTURE_MISSING
                  check: 逐字检查最终 Markdown 至少按顺序包含输入与样本/口径、数据质量与清洗、结构化反馈或指标基线、趋势与异常、归因假设与替代解释、反例与冲突、边界真值表、限制与未验证项、证据追溯矩阵；不适用内容保留标题说明原因。
                  fail_evidence:
                    - 最终产物路径
                    - 缺失或乱序标题及行号
                    - 对应 Skill 的固定输出契约
                - rule_id: USER_ANALYSIS_NUMBER_TRACE
                  defect_type: USER_ANALYSIS_NUMBER_UNTRACEABLE
                  check: 逐项核对数字、比例、趋势、引文和图表是否回到 E-*、SRC-*、输入位置、时间窗、分母与公式；脚本结果不得被当成新的原始事实源。
                  fail_evidence:
                    - 数字/引文/图表原文及行号
                    - E-*、SRC-* 与输入位置检索结果
                    - 缺失时间窗、分母或公式
                - rule_id: USER_ANALYSIS_INFERENCE_BOUNDARY
                  defect_type: USER_ANALYSIS_INFERENCE_OR_BOUNDARY_MISMATCH
                  check: 核对评论声量未外推用户总体、相关性未写成因果、归因假设列出替代解释；逐行复算样本/时间窗/阈值真值表，未知阈值不得自创。
                  fail_evidence:
                    - 外推或因果化原文及行号
                    - 替代解释检索结果
                    - 边界代入式与应有结论
          ```
        toolFilter:
          deny:
            - customer_research
            - interrupt_agent
            - list_agents
            - product_discovery
            - quality_judge
            - requirement_management
            - requirement_review
            - send_message

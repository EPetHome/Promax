      - 同一成员已有可继续的 child session 时优先使用 `send_message` 续接；否则调用该成员的稳定工具名创建 child session。
      - 一个消息命中多个成员时由你协调拆分；未知 mention 必须要求修正，不能猜测。
      - 面向用户只展示 Promax 成员与任务状态，不展示或要求用户选择 dsh 原生 subagent。


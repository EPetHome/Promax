                    - 缺失或乱序标题及行号
                    - 对应 Skill 的固定输出契约
                - rule_id: USER_ANALYSIS_NUMBER_TRACE
                  defect_type: USER_ANALYSIS_NUMBER_UNTRACEABLE
                  check: 逐项核对数字、比例、趋势、引文和图表是否回到 E-*、SRC-*、输入位置、时间窗、分母与公式；脚本结果不得被当成新的原始事实源。
                  fail_evidence:
                    - 数字/引文/图表原文及行号
                    - E-*、SRC-* 与输入位置检索结果
                    - 缺失时间窗、分母或公式
                - rule_id: USER_ANALYSIS_INFERENCE_BOUNDARY
                  defect_type: USER_ANALYSIS_INFERENCE_OR_BOUNDARY_MISMATCH
                  check: 核对评论声量未外推用户总体、相关性未写成因果、归因假设列出替代解释；逐行复算样本/时间窗/阈值真值表，未知阈值不得自创。
                  fail_evidence:
                    - 外推或因果化原文及行号
                    - 替代解释检索结果
                    - 边界代入式与应有结论
          ```
        toolFilter:
          allow:
            - glob
            - grep
            - read
            - write
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: "@deepseek-ai/dsh-compaction-basic"
    - id: command-compact
      name: "@deepseek-ai/dsh-command-compact"
    - id: tool-result-pruner
      name: "@deepseek-ai/dsh-compaction-tool-result-pruner"
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
- id: tool-ask-user
  name: "@deepseek-ai/dsh-tool-ask-user"
- id: hooks-claude-code
  name: "@deepseek-ai/dsh-hooks-claude-code"
  config:
    configPath: ./hooks.json
- id: tool-todo
  name: "@deepseek-ai/dsh-tool-todo"
  config:
    allowParallelInProgress: false

<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>产品原型</title>
  <style>
    :root { --canvas:#f6f8fc; --surface:#fff; --text:#141a28; --muted:#626e86; --border:#d7deec; --action:#4257d6; --focus:#7f91ff; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:var(--canvas); }
    button,input,select,textarea { font:inherit; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid var(--focus); outline-offset:2px; }
    .shell { width:min(1120px,calc(100% - 32px)); margin:0 auto; padding:32px 0; }
    .panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:24px; }
    @media (max-width:700px) { .shell { width:min(100% - 20px,1120px); padding:16px 0; } .panel { padding:16px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel" aria-labelledby="page-title">
      <h1 id="page-title">产品原型</h1>
      <p>从产品方案、交互规格与设计系统生成此处内容。</p>
      <button type="button" id="primary-action">执行主任务</button>
      <p id="status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script>
    document.querySelector('#primary-action').addEventListener('click', () => {
      document.querySelector('#status').textContent = '这是示例反馈，请替换为真实的原型状态变化。';
    });
  </script>
</body>
</html>

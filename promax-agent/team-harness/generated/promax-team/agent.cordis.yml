                - rule_id: REQUIREMENT_REVIEW_CROSS_ARTIFACT_BOUNDARY
                  defect_type: REQUIREMENT_REVIEW_CROSS_ARTIFACT_MISMATCH
                  check: 逐项核对 PRD、业务图与原型的术语、角色、状态、谓词和结果分支；边界表必须实际代入三点，数量变化先算 after，before=N、delta=1 必须判拒绝。未提供某产物时只能标未验证。
                  fail_evidence:

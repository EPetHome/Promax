                    - 缺失或乱序标题及行号
                    - 相邻标题原文
                - rule_id: REQUIREMENT_REVIEW_ISSUE_EVIDENCE
                  defect_type: REQUIREMENT_REVIEW_ISSUE_UNLOCATABLE
                  check: 每个 RR-* 问题必须含级别、文件位置、原文、判断依据、影响、整改建议、状态和责任人，并明确分类为已证实缺陷、风险、建议或未验证；没有可定位证据不得制造问题。
                  fail_evidence:

                  fail_evidence:
                    - 数字/引文/图表原文及行号
                    - E-*、SRC-* 与输入位置检索结果
                    - 缺失时间窗、分母或公式
                - rule_id: USER_ANALYSIS_INFERENCE_BOUNDARY
                  defect_type: USER_ANALYSIS_INFERENCE_OR_BOUNDARY_MISMATCH
                  check: 核对评论声量未外推用户总体、相关性未写成因果、归因假设列出替代解释；逐行复算样本/时间窗/阈值真值表，未知阈值不得自创。
                  fail_evidence:
                    - 外推或因果化原文及行号
                    - 替代解释检索结果
                    - 边界代入式与应有结论

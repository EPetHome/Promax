                    - 三点表位置
                    - 具体代入式、布尔结果和文档分支
            diagram:
              display_name: 业务流程图
              rules:
                - rule_id: DIAGRAM_REQUIRED_BLOCKS
                  defect_type: DIAGRAM_STRUCTURE_MISSING
                  check: 逐字检查最终 Markdown 是否按顺序包含 1. 图表类型与业务问题、2. 参与者/节点/条件/边与证据映射、3. Mermaid 图、4. 主流程/异常与补偿说明、5. 矛盾/缺口与设计选择、6. 边界真值表与验证记录六个区块。
                  fail_evidence:

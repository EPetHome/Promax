    description: 用户反馈结构化处理技能。当用户需要：(1) 整合分散在客服记录、应用商店、社群、问卷等渠道的用户反馈，(2) 对海量反馈进行清洗、去重、归类，(3) 提取用户痛点和需求，(4) 生成结构化反馈清单时，使用此技能。输入为多渠道用户反馈数据（客服记录、社群消息、问卷结果、应用商店评论等）；输出为结构化反馈清单、痛点分类、情感分析结果、典型原声摘录。支持自动去重、语义聚类、情感分析。

api_version: promax.ai/v1alpha2
kind: AgentModule
metadata:
  module_id: requirement-review
  revision: 2
  display_name: 需求评审
  description: 对最终方案产物做独立、可定位的完整性、逻辑、状态与可测性评审。
spec:
  role: worker
  objective: 对任务包点名的最终方案执行需求评审、逻辑检查和问题跟踪，并写出独立评审报告。
  base_persona: |-
    你是 Promax 需求评审智能体，工作目录是 {{cwd}}。开始前完整加载 `requirement-review`、`logic-detector` 与 `issue-tracker`，只评审协调者点名的原始输入和最终方案产物，不修改 PRD、业务图或原型，也不代替方案作者重写需求。

    检查完整性、歧义、跨产物逻辑、角色与术语一致性、状态与数据流、边界条件、依赖和验收可测性。每个问题必须包含严重级别、可定位位置、原文、判断依据、影响和整改建议；区分已证实缺陷、风险、建议与材料不足导致的未验证项。没有可定位证据时不得制造问题。

    只写 `deliverables/{task_key}/requirement_review.md`。写入后回读并确认问题清单、证据、状态和遗留风险完整；该评审报告本身仍须交独立 Judge。
  skill_refs:
    - requirement-review@2
    - logic-detector@2
    - issue-tracker@2
  tool_profile_id: document-worker
  delegation:
    provider: spawn
    background_mode: continuable
    max_depth: 1
  artifacts:
    - kind: other
      validation_kind: requirement-review-report
      relative_path: deliverables/{task_key}/requirement_review.md
      required: true
  validation_profile_id: requirement-review-r6

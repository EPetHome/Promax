api_version: promax.ai/v1alpha2
kind: AgentModule
metadata:
  module_id: requirement-management
  revision: 2
  display_name: 需求管理
  description: 保真整理需求，并通过固定版 Lark CLI 执行受门禁的只读与 dry-run；周报仅被动接受后端派单。
spec:
  role: worker
  objective: 保真整理需求、冲突、依赖、状态与待补信息，只生成本地 Markdown，不声称执行外部系统动作。
  provides: [scope, constraint, requirements_priority]
  requires: [goal, scenario, pain_point]
  base_persona: |-
    你是 Promax 需求管理智能体，工作目录是 {{cwd}}。先加载任务所需的需求管理 Skill；只处理不可变输入清单和协调者点名的前置最终产物。固定版 Lark CLI 通过受控工具提供，默认只读；未具备凭据、用户确认、成员 ACL 与写审计门时只能生成 dry-run，不能声称写入多维表格、更新看板或完成系统归档。

    保留需求原文与来源，分别记录需求对象、场景、问题、价值、范围、依赖、冲突、状态和待补信息。相似项只能标为疑似重复并给出比较依据；不得擅自合并、删除、承诺排期或决定优先级。引用前置业务产物时必须同时保留其原始输入指针。

    周报监控只被动接受后端带 job_id 的派单，不注册 Cron、不常驻、不主动推送。只写 `deliverables/{task_key}/requirement_management.md`。写入后回读，明确列出已整理内容、只读/dry-run 证据、数据缺口和所有未执行的外部系统动作；自检不等于 Judge 通过。
  skill_refs:
    - feishu-requirement-entry@1
    - feishu-requirement-board@1
    - feishu-requirement-archive@1
    - pm-weekly-monitor@1
  tool_profile_id: requirement-management-worker
  delegation:
    provider: spawn
    background_mode: continuable
    max_depth: 1
  artifacts:
    - kind: other
      validation_kind: requirement-management-report
      relative_path: deliverables/{task_key}/requirement_management.md
      required: true
  validation_profile_id: requirement-management-r6

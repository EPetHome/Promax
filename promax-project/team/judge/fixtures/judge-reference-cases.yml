    frozen_input:
      manifest: .任务/国内个人网盘产品调研/输入/manifest.yml
      manifest_sha256: (见文件原字节；运行时读取校验)
      sources: [SRC-001]
      note: 仅 1 条 user-provided 需求说明，无外部取证；记录的是当时实际输入，不代表充分。
    artifact_versions:
      - filename: product_discovery.md
        sha256: e03974bd42040e914b6ff3bd424ba571f41154a55ae33d37d3c65ed04bd30d65
    applicable_baseline: 旧机制（无 acceptance baseline 逐项记录）；规则版本未知
    evaluable_scope: 只能评「当期产品事实是否取得适用依据」这一确定性缺口，不能评整份报告业务质量
    reference_label:
      kind: disputed_candidate_misrelease
      verdict: 未定（候选误放行）
      basis:
        - 唯一外部依据为需求说明，产品事实以知识基标注待核实
        - r3 PASS 把「结论强度限制」当作可接受，未要求当期产品事实依据
      confirmation: pending_human_confirmation
      confirmed_by: null
      disputed: true
    gaps:
      - 未对报告逐项建立独立合格/不合格标签；不得据此推断 Judge 整体准确率
      - 旧机制未记录 acceptance baseline 与 rules 版本

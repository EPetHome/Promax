schema_version: 1
kind: JudgeReferenceSet
status: candidate
updated_at: 2026-09-22
# 11.1 参考集：优先复用现有冻结输入、成果版本与完整评审轨迹，不复制成新的“真值”。
# 标签规则：
# - deterministic_recompute：可由冻结原始数据与明确口径独立复算，Pi 已执行复算并记录命令。
# - pending_human_confirmation：需要业务/领域审阅者确认，Pi 不假扮人工确认者。
# - historical_unknown：旧机制未留必要字段，只作问题/流程反例，不参与按版本分组的成绩。
# - 历史 PASS / verified 不自动生成“合格”标签。
usage_policy:
  rule_debug: 仅用于修改规则与回归测试的样本；不得用于计算 Judge 准确率。
  evaluation: 用于评价误放行/误阻断/漏检；必须同时报告可判定分母、未知项与争议项数量。
  excluded_from_scoring:
    - 缺少独立标签的样本
    - 加载版本未知（historical_unknown）的样本
    - 任何以一个案例代表整体业务质量的推断
sample_fields:
  - sample_id
  - usage
  - source
  - frozen_input
  - artifact_versions
  - applicable_baseline
  - evaluable_scope
  - reference_label
  - gaps

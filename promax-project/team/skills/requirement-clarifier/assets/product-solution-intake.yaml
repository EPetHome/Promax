schema_version: "1.0"
requirement_id: "REQ-000"
objective: "用一句话描述本次要解决的产品问题和期望结果"

source_materials:
  - path: ""
    purpose: "需求、访谈、数据、历史方案或业务规则"

known_rules: []

constraints:
  users: "内部人员"
  platform: "通用 Web；具体运行细节由后续项目补充"
  security: []
  brand_or_ui_paths: []
  other: []

requested_artifacts:
  - solution
  - diagrams
  - interaction
  - ui_system
  - prototype
  - audit
  - handoff

acceptance:
  - "核心任务路径可被产品人员走通"
  - "需求、页面、状态和验收标准可追溯"
  - "HTML 原型为单文件且无外部运行依赖"
  - "交付前列出真实执行的检查与未覆盖项"

clarification_policy:
  max_blocking_questions: 3
  defaultable_gaps: explicit_assumption
  assumption_prefix: "A-"

prototype:
  strategy: auto
  exploration_questions: []
  target_viewports: [1440, 1024, 768, 375]
  themes: [light, dark]
  self_contained: true

handoff:
  required: true
  receiving_agent: "研发智能体"
  technical_architecture_in_scope: false

output_dir: "./output"

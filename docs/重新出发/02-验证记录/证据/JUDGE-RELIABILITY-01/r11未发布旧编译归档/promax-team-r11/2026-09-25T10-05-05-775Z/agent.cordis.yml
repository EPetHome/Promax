          - `alert-early-warning@1`
          - `app-market-sentiment@1`
          - `core-metrics-analysis@1`
          - `data-visualization@1`
          - `telemetry-tracker@1`
          - `user-feedback-processor@1`

          仅在任务需要时通过 skill 工具加载正文；这些引用不改变权限与安全边界。

          PROMAX_MEMBER_ID:user_analysis
